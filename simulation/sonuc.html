<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ödeme Sonucu - KitapDünyası</title>
    <style>
        :root {
            --forest: #012619;
            --green: #4EA664;
            --mint: #78BF9E;
            --sage: #A9D9C2;
            --cream: #E8E5DE;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f4;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .result-card {
            background: white;
            border-radius: 20px;
            padding: 2.5rem;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .result-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            font-size: 2.5rem;
        }
        .result-icon.success {
            background-color: #dcfce7;
            color: var(--green);
        }
        .result-icon.error {
            background-color: #fee2e2;
            color: #dc2626;
        }
        .result-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--forest);
            margin-bottom: 0.5rem;
        }
        .result-message {
            color: #666;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }
        .result-details {
            background: var(--cream);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1.5rem;
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }
        .detail-row:last-child {
            margin-bottom: 0;
        }
        .detail-label {
            color: #666;
        }
        .detail-value {
            font-weight: 600;
            color: var(--forest);
        }
        .btn-continue {
            width: 100%;
            padding: 1rem;
            background-color: var(--green);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-continue:hover {
            opacity: 0.9;
        }
        .btn-continue.error {
            background-color: var(--forest);
        }
    </style>
</head>
<body>
    <div class="result-card" id="result-card">
        <div class="result-icon" id="result-icon">✓</div>
        <h1 class="result-title" id="result-title">Ödeme Başarılı!</h1>
        <p class="result-message" id="result-message">
            Ödemeniz başarıyla tamamlandı.
        </p>
        <div class="result-details" id="result-details"></div>
        <button class="btn-continue" id="btn-continue" onclick="continueShopping()">
            Alışverişe Devam Et
        </button>
    </div>

    <script>
        // URL'den parametreleri al
        const urlParams = new URLSearchParams(window.location.search);
        const status = urlParams.get('status');
        const amount = urlParams.get('amount');
        const merchant = urlParams.get('merchant');

        const icon = document.getElementById('result-icon');
        const title = document.getElementById('result-title');
        const message = document.getElementById('result-message');
        const details = document.getElementById('result-details');
        const btn = document.getElementById('btn-continue');

        if (status === 'success') {
            icon.textContent = '✓';
            icon.className = 'result-icon success';
            title.textContent = 'Ödeme Başarılı!';
            title.style.color = '#012619';
            message.textContent = 'Siparişiniz alındı. Teşekkür ederiz!';
            details.innerHTML = `
                <div class="detail-row">
                    <span class="detail-label">Mağaza</span>
                    <span class="detail-value">${merchant || 'KitapDünyası'}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Ödenen Tutar</span>
                    <span class="detail-value">${parseFloat(amount).toFixed(2).replace('.', ',')} ₺</span>
                </div>
            `;
            btn.className = 'btn-continue';

            // Sepeti temizle
            localStorage.removeItem('cart');
        } else {
            icon.textContent = '✕';
            icon.className = 'result-icon error';
            title.textContent = 'Ödeme Başarısız';
            title.style.color = '#dc2626';
            message.textContent = 'Ödemeniz işlenemedi. Lütfen tekrar deneyin.';
            details.innerHTML = `
                <div class="detail-row">
                    <span class="detail-label">Mağaza</span>
                    <span class="detail-value">${merchant || 'KitapDünyası'}</span>
                </div>
            `;
            btn.textContent = 'Tekrar Dene';
            btn.className = 'btn-continue error';
        }

        function continueShopping() {
            if (status === 'success') {
                // Başarılıysa anasayfaya git
                window.location.href = 'ecommerce.html';
            } else {
                // Başarısızsa ödeme sayfasına geri dön
                window.location.href = 'odeme.html';
            }
        }
    </script>
</body>
</html>
