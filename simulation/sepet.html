<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sepetim - Zamazor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, 'Helvetica Neue', sans-serif;
            background-color: #EAEDED;
        }
        header {
            background-color: #131921;
            color: white;
            padding: 0.75rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 1.4rem;
            font-weight: 900;
            color: #FF9900;
            cursor: pointer;
            letter-spacing: -0.5px;
        }
        .logo span { color: white; }
        .header-label {
            font-size: 1rem;
            color: #CCC;
        }
        .container {
            max-width: 800px;
            margin: 1.5rem auto;
            padding: 0 1rem;
        }
        .page-title {
            color: #131921;
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }
        .cart-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .cart-item {
            background: white;
            border-radius: 8px;
            padding: 1rem 1.2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            border: 1px solid #DDD;
        }
        .item-image { font-size: 2.5rem; flex-shrink: 0; }
        .item-info { flex: 1; }
        .item-name {
            font-weight: 600;
            color: #007185;
            margin-bottom: 4px;
            font-size: 0.95rem;
        }
        .item-price {
            color: #B12704;
            font-weight: 700;
            font-size: 1.05rem;
        }
        .item-shipping { font-size: 0.8rem; color: #555; margin-top: 2px; }
        .item-remove {
            background: none;
            border: none;
            color: #007185;
            font-size: 0.85rem;
            cursor: pointer;
            text-decoration: underline;
            padding: 4px;
        }
        .item-remove:hover { color: #C7511F; }
        .summary {
            background: white;
            border-radius: 8px;
            padding: 1.5rem;
            margin-top: 1.2rem;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            border: 1px solid #DDD;
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.75rem;
            color: #333;
            font-size: 0.95rem;
        }
        .summary-row.total {
            font-size: 1.15rem;
            font-weight: 700;
            color: #B12704;
            border-top: 1px solid #EEE;
            padding-top: 0.75rem;
            margin-top: 0.75rem;
        }
        .btn-checkout {
            width: 100%;
            padding: 1rem;
            background-color: #FF9900;
            color: #131921;
            border: none;
            border-radius: 20px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 1rem;
            transition: background 0.15s;
        }
        .btn-checkout:hover { background-color: #E47911; }
        .empty-cart {
            background: white;
            border-radius: 8px;
            padding: 3rem;
            text-align: center;
            color: #666;
            border: 1px solid #DDD;
        }
        .empty-icon { font-size: 4rem; margin-bottom: 1rem; }
        .btn-continue {
            background-color: #FF9900;
            color: #131921;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 1rem;
            font-size: 0.9rem;
        }
        .btn-continue:hover { background-color: #E47911; }
        .secure-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            justify-content: center;
            margin-top: 1rem;
            font-size: 0.8rem;
            color: #555;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo" onclick="goHome()">zamazor<span>.com.tr</span></div>
        <div class="header-label">🛒 Sepetim</div>
    </header>

    <div class="container">
        <h1 class="page-title">Alışveriş Sepeti</h1>
        <div class="cart-grid" id="cart-items"></div>
        <div id="cart-summary"></div>
    </div>

    <script>
        let cart = JSON.parse(localStorage.getItem('cart')) || [];

        function renderCart() {
            const itemsContainer = document.getElementById('cart-items');
            const summaryContainer = document.getElementById('cart-summary');

            if (cart.length === 0) {
                itemsContainer.innerHTML = `
                    <div class="empty-cart">
                        <div class="empty-icon">🛒</div>
                        <p style="font-size:1.1rem;font-weight:600;color:#131921;margin-bottom:0.5rem">Sepetiniz boş</p>
                        <p style="font-size:0.9rem">Alışverişe devam etmek için mağazaya dönün.</p>
                        <button class="btn-continue" onclick="goHome()">Alışverişe Devam Et</button>
                    </div>
                `;
                summaryContainer.innerHTML = '';
                return;
            }

            let itemsHtml = '';
            cart.forEach((item, index) => {
                itemsHtml += `
                    <div class="cart-item">
                        <div class="item-image">${item.image}</div>
                        <div class="item-info">
                            <div class="item-name">${item.name}</div>
                            <div class="item-price">${item.price.toFixed(2).replace('.', ',')} ₺</div>
                            <div class="item-shipping">Ücretsiz Kargo ile yarın teslim</div>
                        </div>
                        <button class="item-remove" onclick="removeItem(${index})">Kaldır</button>
                    </div>
                `;
            });
            itemsContainer.innerHTML = itemsHtml;

            const total = cart.reduce((sum, item) => sum + item.price, 0);
            summaryContainer.innerHTML = `
                <div class="summary">
                    <div class="summary-row">
                        <span>Ürün Sayısı</span>
                        <span>${cart.length} adet</span>
                    </div>
                    <div class="summary-row">
                        <span>Kargo</span>
                        <span style="color:#007185">Ücretsiz</span>
                    </div>
                    <div class="summary-row total">
                        <span>Sipariş Toplamı</span>
                        <span>${total.toFixed(2).replace('.', ',')} ₺</span>
                    </div>
                    <button class="btn-checkout" onclick="goToCheckout()">Ödemeye Geç</button>
                    <div class="secure-badge">🔒 Güvenli ödeme — ParaÜstü ile</div>
                </div>
            `;
        }

        function removeItem(index) {
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            renderCart();
        }

        function goHome() { window.location.href = 'ecommerce.html'; }
        function goToCheckout() { window.location.href = 'odeme.html'; }

        renderCart();
    </script>
</body>
</html>
